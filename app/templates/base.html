<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Solar Quote Management System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>

    <nav>
        <a href="{{ url_for('main.home') }}">Home</a>

        {% if current_user.is_authenticated %}
            <a href="{{ url_for('customers.customer_list') }}">
                Customers
            </a>

            <a href="{{ url_for('products.list_products') }}">
                Products
            </a>

            <span>
                Logged in as {{ current_user.email }}
            </span>

            <form
                method="POST"
                action="{{ url_for('auth.logout') }}"
                style="display: inline;"
            >
                <button type="submit">
                    Logout
                </button>
            </form>
        {% else %}
            <a href="{{ url_for('auth.login') }}">
                Login
            </a>
        {% endif %}
    </nav>

    {% block content %}
    {% endblock %}

</body>
</html>
