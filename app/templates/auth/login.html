{% extends "base.html" %}

{% block title %}
Login | Solar Quote Management System
{% endblock %}

{% block content %}

<h1>Login</h1>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form method="POST">

    <div>
        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >
    </div>

    <div>
        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >
    </div>

    <button type="submit">
        Login
    </button>

</form>

{% endblock %}
