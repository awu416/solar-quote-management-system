{% extends "base.html" %}

{% block content %}
<h1>Create Customer</h1>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form method="POST">
    <p>
        <label for="first_name">First Name</label><br>
        <input
            type="text"
            id="first_name"
            name="first_name"
            required
        >
    </p>

    <p>
        <label for="last_name">Last Name</label><br>
        <input
            type="text"
            id="last_name"
            name="last_name"
            required
        >
    </p>

    <p>
        <label for="email">Email</label><br>
        <input
            type="email"
            id="email"
            name="email"
            required
        >
    </p>

    <p>
        <label for="phone">Phone</label><br>
        <input
            type="text"
            id="phone"
            name="phone"
            required
        >
    </p>

    <button type="submit">
        Create Customer
    </button>
</form>

<p>
    <a href="{{ url_for('customers.customer_list') }}">
        Back to Customers
    </a>
</p>
{% endblock %}
